<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BESS — design curriculum</title>
  <meta name="description" content="Interactive BESS curriculum for the German market: sizing, architecture, losses, grid connection." />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=20" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <span>BESS <span class="muted">/ lab</span></span>
    </div>
    <div class="progress" title="Drill progress">
      <div class="track"><div class="bar" id="bar"></div></div>
      <span id="count" class="count">0 / 12 solved</span>
    </div>
  </header>

  <div class="modulebar">
    <label class="select-wrap">
      <span class="sr-only">Module</span>
      <select id="module-select" aria-label="Choose module"></select>
    </label>
  </div>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" id="tab-learn" role="tab" aria-selected="true" aria-controls="view-learn">Learn</button>
    <button class="tab" id="tab-calc" role="tab" aria-selected="false" aria-controls="view-calc">Calculate</button>
    <button class="tab" id="tab-drill" role="tab" aria-selected="false" aria-controls="view-drill">Drill</button>
  </nav>

  <main>
    <section id="view-learn" role="tabpanel" aria-labelledby="tab-learn">
      <div id="lesson"></div>
    </section>

    <section id="view-calc" role="tabpanel" aria-labelledby="tab-calc" hidden>
      <div id="calc-host"></div>
    </section>

    <section id="view-drill" role="tabpanel" aria-labelledby="tab-drill" hidden>
      <div id="drill-body"></div>
    </section>
  </main>

  <footer class="foot">
    <span>Anchor plant: 100 MW / 400 MWh · 110 kV · 20 years</span>
    <span class="ver" id="app-version">v20</span>
  </footer>

  <script src="./calc.js?v=20"></script>
  <script src="./content.js?v=20"></script>
  <script src="./m1.js?v=20"></script>
  <script src="./m2.js?v=20"></script>
  <script src="./m3.js?v=20"></script>
  <script src="./m4.js?v=20"></script>
  <script src="./m5.js?v=20"></script>
  <script src="./m6.js?v=20"></script>
  <script src="./m7.js?v=20"></script>
  <script src="./m8.js?v=20"></script>
  <script src="./m9.js?v=20"></script>
  <script src="./m10.js?v=20"></script>
  <script src="./m11.js?v=20"></script>
  <script src="./m12.js?v=20"></script>
  <script src="./m13.js?v=20"></script>
  <script src="./m14.js?v=20"></script>
  <script src="./m15.js?v=20"></script>
  <script src="./m16.js?v=20"></script>
  <script src="./app.js?v=20"></script>
</body>
</html>
